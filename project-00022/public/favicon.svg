<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="ropeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="16" />

  <!-- Gallows Stand -->
  <path d="M 120 410 L 392 410" stroke="#38bdf8" stroke-width="24" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 180 410 L 180 100 L 340 100 L 340 160" stroke="#38bdf8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 180 180 L 260 100" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" />

  <!-- Rope Loop -->
  <path d="M 340 160 L 340 200" stroke="url(#ropeGrad)" stroke-width="14" stroke-linecap="round" stroke-dasharray="12 6" />

  <!-- Stickman Hero (Rescued with Raised Victory Arms!) -->
  <g filter="url(#glow)">
    <!-- Head with Smile -->
    <circle cx="340" cy="235" r="32" stroke="#10b981" stroke-width="16" fill="#064e3b" />
    <path d="M 328 238 Q 340 248 352 238" stroke="#10b981" stroke-width="10" fill="none" stroke-linecap="round" />
    
    <!-- Torso -->
    <line x1="340" y1="267" x2="340" y2="350" stroke="#10b981" stroke-width="16" stroke-linecap="round" />
    
    <!-- Raised Victory Arms -->
    <line x1="340" y1="290" x2="290" y2="240" stroke="#10b981" stroke-width="16" stroke-linecap="round" />
    <line x1="340" y1="290" x2="390" y2="240" stroke="#10b981" stroke-width="16" stroke-linecap="round" />
    
    <!-- Legs -->
    <line x1="340" y1="350" x2="300" y2="400" stroke="#10b981" stroke-width="16" stroke-linecap="round" />
    <line x1="340" y1="350" x2="380" y2="400" stroke="#10b981" stroke-width="16" stroke-linecap="round" />
  </g>
</svg>
